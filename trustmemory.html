<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustMemory AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EA;
  --paper-dim:#E4E7DE;
  --card:#FFFFFF;
  --ink:#1C2530;
  --ink-soft:#5B6572;
  --ink-faint:#8A93A0;
  --line:rgba(28,37,48,.13);
  --line-strong:rgba(28,37,48,.24);
  --brass:#B4863F;
  --brass-dark:#8F6A2E;
  --brass-tint:#F3E8D6;
  --teal:#3F6659;
  --teal-tint:#E1EAE5;
  --rust:#A6453A;
  --rust-tint:#F4E3E0;
  --amber:#B4863F;
  --font-serif:'Source Serif 4', Georgia, serif;
  --font-sans:'IBM Plex Sans', Arial, sans-serif;
  --font-mono:'IBM Plex Mono', monospace;
  --radius:3px;
  color-scheme: light;
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-sans);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
h1,h2,h3,h4{font-family:var(--font-serif); font-weight:600; margin:0; letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
a{color:inherit;}
::selection{background:var(--brass-tint);}

/* ---------- layout ---------- */
#shell{display:flex; min-height:100vh;}
#rail{
  width:230px; flex:none; background:var(--ink); color:#EDE9DF;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh;
  padding-top:env(safe-area-inset-top,0px);
}
#rail .brand{padding:22px 20px 16px; border-bottom:1px solid rgba(237,233,223,.14);}
#rail .brand .mark{font-family:var(--font-serif); font-size:19px; font-weight:600; color:#fff; letter-spacing:-0.01em;}
#rail .brand .sub{font-size:11px; color:#B7BDC8; margin-top:4px; line-height:1.4;}
#rail nav{flex:1; padding:10px 10px; overflow-y:auto;}
#rail nav button{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  background:none; border:none; color:#C7CBD3; padding:9px 10px; border-radius:var(--radius);
  cursor:pointer; font-size:13.5px; margin-bottom:1px; transition:background .12s, color .12s;
}
#rail nav button .dot{width:5px; height:5px; border-radius:50%; background:transparent; flex:none;}
#rail nav button:hover{background:rgba(237,233,223,.07); color:#fff;}
#rail nav button.active{background:rgba(180,134,63,.22); color:#fff;}
#rail nav button.active .dot{background:var(--brass);}
#rail .rail-foot{padding:14px 20px 18px; border-top:1px solid rgba(237,233,223,.14);}
#rail .rail-foot button{
  width:100%; padding:8px 10px; background:transparent; border:1px solid rgba(237,233,223,.3);
  color:#EDE9DF; border-radius:var(--radius); cursor:pointer; font-size:12.5px;
}
#rail .rail-foot button:hover{border-color:#fff;}

#main{flex:1; min-width:0; display:flex; flex-direction:column;}
#ticker{
  background:#fff; border-bottom:1px solid var(--line); padding:8px 28px; font-size:12px;
  color:var(--ink-soft); display:flex; align-items:center; gap:8px; cursor:pointer;
}
#ticker b{color:var(--ink); font-weight:600;}
#ticker .tk-dot{width:6px;height:6px;border-radius:50%; background:var(--brass); flex:none;}
#content{padding:28px 32px 60px; max-width:1180px; width:100%; margin:0 auto;}

/* ---------- generic components ---------- */
.pagehead{margin-bottom:22px;}
.pagehead h1{font-size:25px;}
.pagehead .lede{color:var(--ink-soft); font-size:13.5px; margin-top:5px; max-width:60ch;}
.eyebrow{font-size:11.5px; color:var(--brass-dark); font-weight:600; margin-bottom:4px;}

.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,1fr);} .g3{grid-template-columns:1fr 1fr;} .g2{grid-template-columns:1fr;}}

.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
.metric{padding:16px 18px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius);}
.metric .label{font-size:11.5px; color:var(--ink-soft); text-transform:none;}
.metric .num{font-family:var(--font-serif); font-size:30px; margin-top:6px; font-weight:600;}
.metric .num.warn{color:var(--rust);}
.metric .num.ok{color:var(--teal);}

.section{margin-bottom:30px;}
.section > h2{font-size:16px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
.section > .desc{color:var(--ink-soft); font-size:12.5px; margin:-6px 0 12px;}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11px; padding:2px 8px; border-radius:20px; font-weight:600; white-space:nowrap;}
.badge.ok{background:var(--teal-tint); color:var(--teal);}
.badge.warn{background:var(--brass-tint); color:var(--brass-dark);}
.badge.bad{background:var(--rust-tint); color:var(--rust);}
.badge.neutral{background:var(--paper-dim); color:var(--ink-soft);}

.btn{display:inline-flex; align-items:center; gap:6px; border-radius:var(--radius); border:1px solid var(--line-strong); background:#fff; color:var(--ink); padding:8px 14px; font-size:12.5px; font-weight:600; cursor:pointer;}
.btn:hover{border-color:var(--ink);}
.btn.primary{background:var(--ink); color:#fff; border-color:var(--ink);}
.btn.primary:hover{background:#000;}
.btn.brass{background:var(--brass); color:#fff; border-color:var(--brass);}
.btn.brass:hover{background:var(--brass-dark);}
.btn.sm{padding:5px 10px; font-size:11.5px;}
.btn[disabled]{opacity:.45; cursor:not-allowed;}
select, input[type=text]{font-family:inherit; font-size:12.5px; padding:7px 9px; border-radius:var(--radius); border:1px solid var(--line-strong); background:#fff; color:var(--ink);}

.hr{height:1px; background:var(--line); border:none; margin:16px 0;}

/* alert list */
.alert{display:flex; gap:14px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line);}
.alert:last-child{border-bottom:none;}
.alert .flag{width:8px; height:8px; border-radius:50%; margin-top:6px; flex:none;}
.alert .flag.warn{background:var(--brass);}
.alert .flag.bad{background:var(--rust);}
.alert .flag.info{background:var(--teal);}
.alert .body{flex:1;}
.alert .title{font-weight:600; font-size:13.5px;}
.alert .sub{color:var(--ink-soft); font-size:12px; margin-top:2px;}
.alert .cta{flex:none;}

/* table list */
.rowlist{display:flex; flex-direction:column;}
.rowitem{display:flex; align-items:center; gap:14px; padding:13px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.rowitem:last-child{border-bottom:none;}
.rowitem:hover .name{color:var(--brass-dark);}
.avatar{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-weight:600; font-size:14px; color:#fff; flex:none;}
.rowitem .meta{flex:1; min-width:0;}
.rowitem .name{font-weight:600; font-size:13.5px;}
.rowitem .sub{color:var(--ink-soft); font-size:12px; margin-top:1px;}
.rowitem .scores{display:flex; gap:8px; flex:none;}
.scorepill{text-align:center; min-width:64px;}
.scorepill .v{font-family:var(--font-serif); font-weight:600; font-size:16px;}
.scorepill .l{font-size:10px; color:var(--ink-soft);}

/* detail header */
.detail-head{display:flex; gap:18px; align-items:center; margin-bottom:22px;}
.detail-head .avatar{width:58px; height:58px; font-size:20px;}
.detail-head h1{font-size:22px;}
.detail-head .tags{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}

/* timeline */
.timeline{position:relative; padding-left:22px;}
.timeline::before{content:"";position:absolute; left:5px; top:4px; bottom:4px; width:1px; background:var(--line-strong);}
.tl-item{position:relative; padding-bottom:18px;}
.tl-item::before{content:""; position:absolute; left:-22px; top:4px; width:9px; height:9px; border-radius:50%; background:var(--ink); border:2px solid var(--paper);}
.tl-item.warn::before{background:var(--brass);}
.tl-item.bad::before{background:var(--rust);}
.tl-item.ok::before{background:var(--teal);}
.tl-item .date{font-size:10.5px; color:var(--ink-faint); font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.03em;}
.tl-item .txt{font-size:13px; margin-top:2px;}
.tl-item .tag{display:inline-block; margin-top:4px; font-size:10.5px; color:var(--ink-soft);}

/* why panel */
.why{background:var(--paper-dim); border-radius:var(--radius); padding:16px 18px; border-left:3px solid var(--brass);}
.why h4{font-size:12.5px; color:var(--brass-dark); margin-bottom:8px;}
.why ul{margin:0; padding-left:18px; font-size:13px;}
.why li{margin-bottom:4px;}
.why .action{margin-top:12px; padding-top:12px; border-top:1px solid var(--line-strong); font-size:12.5px;}

/* tabs */
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:16px;}
.tabs button{background:none; border:none; padding:9px 14px; font-size:12.5px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px;}
.tabs button.active{color:var(--ink); border-bottom-color:var(--brass);}

/* memory entries */
.mem-entry{padding:12px 0; border-bottom:1px solid var(--line); font-size:13px;}
.mem-entry:last-child{border-bottom:none;}
.mem-entry .k{font-size:10.5px; font-family:var(--font-mono); color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}

/* matching candidate card */
.candidate{border:1px solid var(--line); border-radius:var(--radius); padding:16px; background:#fff;}
.candidate.top{border-color:var(--brass); background:linear-gradient(180deg,var(--brass-tint),#fff 70%);}
.candidate .rank{font-size:11px; color:var(--ink-faint); font-family:var(--font-mono);}
.candidate .mname{font-family:var(--font-serif); font-size:17px; font-weight:600; margin-top:2px;}
.candidate .mscore{font-size:26px; font-family:var(--font-serif); font-weight:700; color:var(--brass-dark);}
.candidate .facts{margin-top:10px; display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; font-size:11.5px; color:var(--ink-soft);}
.candidate .facts b{color:var(--ink); font-weight:600;}
.candidate ul.why-list{margin:10px 0 0; padding-left:16px; font-size:12px;}
.candidate ul.why-list li{margin-bottom:3px;}

/* agent activity */
.activity-row{display:grid; grid-template-columns:78px 130px 1fr; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px; align-items:baseline;}
.activity-row .t{font-family:var(--font-mono); color:var(--ink-faint); font-size:11px;}
.activity-row .agent{font-weight:600; font-size:11px; padding:2px 7px; border-radius:20px; display:inline-block; width:fit-content;}
.agent.mem{background:#E4E9F2; color:#31507A;}
.agent.dec{background:var(--brass-tint); color:var(--brass-dark);}
.agent.ref{background:#EFE4F2; color:#6A3E7A;}
.agent.match{background:var(--teal-tint); color:var(--teal);}
.agent.voice{background:var(--rust-tint); color:var(--rust);}

/* demo mode */
.scenario-btn{display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line); border-radius:var(--radius); padding:20px; cursor:pointer;}
.scenario-btn:hover{border-color:var(--brass);}
.scenario-btn .snum{font-family:var(--font-mono); font-size:11px; color:var(--brass-dark);}
.scenario-btn h3{font-size:17px; margin-top:4px;}
.scenario-btn .stag{color:var(--ink-soft); font-size:12.5px; margin-top:4px;}

.flow{display:flex; align-items:center; gap:0; margin:20px 0 24px; overflow-x:auto;}
.flow .fstep{flex:1; min-width:90px; text-align:center; padding:10px 4px; border-bottom:3px solid var(--line-strong); color:var(--ink-faint); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; transition:all .2s;}
.flow .fstep.active{color:var(--brass-dark); border-bottom-color:var(--brass);}
.flow .fstep.done{color:var(--ink-soft); border-bottom-color:var(--teal);}

.narration{background:var(--ink); color:#DCE0E6; border-radius:var(--radius); padding:18px 20px; font-family:var(--font-mono); font-size:12.5px; line-height:1.8; max-height:340px; overflow-y:auto;}
.narration .ln{margin-bottom:2px;}
.narration .ln .agent-tag{color:var(--brass);}
.narration .ln.sys{color:#8A93A0;}

.compare{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:16px;}
.compare .box{border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px;}
.compare .box.old{background:var(--paper-dim);}
.compare .box.new{background:var(--teal-tint); border-color:var(--teal);}
.compare .box h4{font-size:12px; margin-bottom:6px;}

.callcard{border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:12px; background:#fff;}
.callcard .transcript{background:var(--paper-dim); border-radius:var(--radius); padding:12px 14px; margin-top:10px; font-size:12.5px;}
.callcard .transcript .who{font-weight:600; margin-top:8px;}
.callcard .transcript .who:first-child{margin-top:0;}
.simbadge{font-size:10.5px; background:var(--brass-tint); color:var(--brass-dark); padding:2px 8px; border-radius:20px; font-weight:600;}

.empty{text-align:center; padding:40px 20px; color:var(--ink-soft);}
.empty h3{color:var(--ink); font-size:15px; margin-bottom:6px;}

.kv{display:flex; justify-content:space-between; font-size:12.5px; padding:7px 0; border-bottom:1px solid var(--line);}
.kv:last-child{border-bottom:none;}
.kv .k{color:var(--ink-soft);}

/* network cylinders (Hindsight Core) */
.netgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.netcyl{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px 14px; text-align:center; position:relative;}
.netcyl.active-net{border-color:var(--brass);}
.netcyl .nicon{width:34px; height:26px; margin:0 auto 10px; border:2px solid var(--ink-soft); border-radius:50%/8px; position:relative;}
.netcyl .nicon::after{content:""; position:absolute; left:-2px; right:-2px; top:8px; bottom:-2px; border:2px solid var(--ink-soft); border-top:none; border-radius:0 0 50%/8px 8px;}
.netcyl .nname{font-size:12px; font-weight:600;}
.netcyl .ncount{font-family:var(--font-serif); font-size:22px; font-weight:600; margin-top:4px;}
.netcyl .ndesc{font-size:10.5px; color:var(--ink-soft); margin-top:4px; line-height:1.4;}

/* architecture swimlanes */
.arch-wrap{overflow-x:auto; padding-bottom:8px;}
.arch-grid{display:grid; grid-template-columns:repeat(3,minmax(230px,1fr)); gap:14px; min-width:760px;}
.lane{border:1px solid var(--line-strong); border-radius:var(--radius); background:#FBFAF6; padding:14px;}
.lane h4{font-size:11.5px; text-transform:none; color:var(--brass-dark); font-weight:600; margin-bottom:10px; padding-bottom:8px; border-bottom:1px solid var(--line);}
.lane .node{background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius); padding:9px 10px; font-size:12px; margin-bottom:8px;}
.lane .node:last-child{margin-bottom:0;}
.lane .node.cyl{background:var(--brass-tint); border-color:var(--brass); font-weight:600;}
.arrow-note{font-size:11px; color:var(--ink-faint); text-align:center; padding:4px 0; font-family:var(--font-mono);}

@media (max-width:760px){
  #rail{position:fixed; left:-230px; z-index:40; transition:left .2s; box-shadow:0 0 0 2000px rgba(0,0,0,0);}
  #rail.open{left:0; box-shadow:6px 0 24px rgba(0,0,0,.25);}
  #content{padding:20px 16px 60px;}
  .g4,.g3,.g2,.compare{grid-template-columns:1fr;}
  #menubtn{display:inline-flex !important;}
}
#menubtn{display:none; align-items:center; gap:8px; background:#fff; border:1px solid var(--line-strong); border-radius:var(--radius); padding:7px 10px; cursor:pointer; margin-right:10px;}
</style>
</head>
<body>
<div id="shell">
  <aside id="rail">
    <div class="brand">
      <div class="mark">TrustMemory AI</div>
      <div class="sub">Memory, intelligence and action layer for placement agencies.</div>
    </div>
    <nav id="navlist"></nav>
    <div class="rail-foot">
      <button id="resetBtn">Reset demo</button>
    </div>
  </aside>
  <div id="main">
    <div id="ticker"><span class="tk-dot"></span><span id="tickerText">Agent activity will appear here.</span></div>
    <div id="content"></div>
  </div>
</div>

<script>
/* =========================================================================
   TRUSTMEMORY AI — single-file interactive prototype
   All five agents (Memory, Decision, Reflection, Matching, Voice) are
   simulated locally in the browser. Hindsight / Groq / Vapi are represented
   through clean adapter functions (retain/recall/reflect, classify, call)
   with deterministic fallback logic, per the product's own "demo
   reliability" principle — no external services are contacted.
   ========================================================================= */

      skills:['elder_care','cooking'], availability:'Full-time',

      roleScores:{elder_care:40, child_care:76, cleaning:58, cooking:52},
      color:'#8F6A2E'},
    {id:'lakshmi', name:'Lakshmi Rao', location:'Hyderabad', exp:10,

    {id:'h102', name:'Reddy Residence', location:'Banjara Hills', requirement:'elder_care', schedule:'Live-in'},
    {id:'h104', name:'Iyer Residence', location:'Madhapur', requirement:'child_care', schedule:'Weekday, 9am–6pm'},
    {id:'h105', name:'Gupta Residence', location:'Kondapur', requirement:'child_care', schedule:'Weekday, 8am–5pm'},
    {id:'h106', name:'Nair Residence', location:'Gachibowli', requirement:'elder_care', schedule:'Live-in, new requirement'},

  ];

  const placements = [
    {id:'p1', helperId:'anita', householdId:'h107', role:'elder_care', start:'2026-01-05', end:null, status:'active'},
    {id:'p2', helperId:'priya', householdId:'h102', role:'elder_care', start:'2025-11-10', end:null, status:'active'},

let INITIAL = seed();
let S = clone(INITIAL);

let clockTick = 0;

function clone(o){return JSON.parse(JSON.stringify(o));}
function nowStamp(){
  clockTick += 1;
  const d = new Date(clockBase.getTime() + clockTick*37000);
  return d.toTimeString().slice(0,8);

function memOf(id){
  if(!MEM[id]) MEM[id] = {world:[], experience:[], opinion:[], observation:[]};

}

/* ---------------------------------------------------------------------
   AGENT ADAPTERS — Hindsight (retain / recall / reflect), LLM classify,
   Voice call. Each has a deterministic fallback and is logged to the
   Agent Activity feed, matching the "demo reliability" requirement.
--------------------------------------------------------------------- */
function retain(entityId, layer, text, meta){
  const m = memOf(entityId);
  m[layer].push({id:uid(), text, meta:meta||{}, t:nowStamp()});
  log('mem','MEMORY AGENT', `Retained ${layer} memory for ${labelFor(entityId)}: "${text}"`);
}
function recall(entityId, note){
  const m = memOf(entityId);
  const count = m.world.length + m.experience.length + m.opinion.length + m.observation.length;
  log('dec','DECISION AGENT', `Recalled ${count} memory entries for ${labelFor(entityId)}${note? ' — '+note:''}.`);
  return m;
}
function classifySeverity(eventType){
  // deterministic fallback standing in for a targeted LLM call (Groq unavailable in-browser)
  const map = {
    late_arrival:{severity:'MEDIUM', confidence:0.81, reason:'Attendance deviation; severity depends on recurrence.'},
    complaint:{severity:'MEDIUM', confidence:0.85, reason:'Household-reported dissatisfaction requires review.'},
    negative_feedback:{severity:'MEDIUM', confidence:0.78, reason:'Negative sentiment recorded in feedback.'},
    positive_feedback:{severity:'LOW', confidence:0.9, reason:'Positive sentiment, no risk signal.'},
    placement_failure:{severity:'HIGH', confidence:0.9, reason:'Placement ended in failure.'},
    successful_placement:{severity:'LOW', confidence:0.92, reason:'Placement concluded successfully.'},
    household_complaint:{severity:'HIGH', confidence:0.83, reason:'Household-side dissatisfaction pattern.'},
    coaching_completed:{severity:'LOW', confidence:0.88, reason:'Coaching resolved with commitments logged.'},
  };
  const r = map[eventType] || {severity:'LOW', confidence:0.6, reason:'Unclassified event type.'};
  log('dec','DECISION AGENT', `Classified severity for "${eventType}" → ${r.severity} (confidence ${r.confidence}). ${r.reason}`);
  return r;
}

/* ---------------------------------------------------------------------
   SCORING — deterministic heuristics (section 9 of the PRD)
--------------------------------------------------------------------- */
function helperEvents(id){ return S.events.filter(e=>e.helperId===id); }
function householdEvents(id){ return S.events.filter(e=>e.householdId===id); }

function computeTrust(helperId){
  const evs = helperEvents(helperId);
  let score = 68; // baseline
  evs.forEach(e=>{
    if(e.type==='positive_feedback') score += 4;
    if(e.type==='placement_start') score += 1;
    if(e.type==='late_arrival') score -= 3;
    if(e.type==='complaint') score -= 6;
    if(e.type==='negative_feedback') score -= 5;
    if(e.type==='placement_end' && !e.description.toLowerCase().includes('replacement')) score += 2;
  });
  return clamp(Math.round(score),0,100);
}

function computeChurn(helperId){
  const evs = helperEvents(helperId).slice().sort((a,b)=> new Date(a.date)-new Date(b.date));
  let score = 18; // baseline low risk
  const recentWindowDays = 30;
  const last = evs.length? new Date(evs[evs.length-1].date): new Date();
  evs.forEach(e=>{
    const days = (last - new Date(e.date))/86400000;
    const recencyWeight = days <= recentWindowDays ? 1.6 : (days <= 90 ? 1 : 0.4);
    if(e.type==='late_arrival') score += 9*recencyWeight;
    if(e.type==='complaint') score += 13*recencyWeight;
    if(e.type==='negative_feedback') score += 10*recencyWeight;
    if(e.type==='placement_end' && e.description.toLowerCase().includes('replacement')) score += 12*recencyWeight;
    if(e.type==='positive_feedback') score -= 5;
    if(e.type==='coaching_completed') score -= 14;
  });
  return clamp(Math.round(score),0,100);
}

function computeDifficulty(householdId){
  const evs = householdEvents(householdId);
  const failed = evs.filter(e=>e.type==='placement_end' && e.description.toLowerCase().includes('replacement')).length;
  const complaints = evs.filter(e=>e.type==='complaint' || e.type==='household_complaint').length;
  let score = 20 + failed*20 + complaints*8;
  return clamp(Math.round(score),0,100);
}

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function recalcAll(){
  S.helpers.forEach(h=>{
    SCORES[h.id] = SCORES[h.id]||{};
    SCORES[h.id].trust = computeTrust(h.id);
    SCORES[h.id].churn = computeChurn(h.id);
  });
  S.households.forEach(h=>{
    SCORES[h.id] = SCORES[h.id]||{};
    SCORES[h.id].difficulty = computeDifficulty(h.id);
  });
}

function trustBand(v){ return v>=80?'Strong': v>=60?'Stable': v>=40?'Needs Attention':'Critical'; }
function trustBadgeClass(v){ return v>=80?'ok': v>=60?'ok': v>=40?'warn':'bad'; }
function churnBadgeClass(v){ return v>=65?'bad': v>=40?'warn':'ok'; }
function diffBadgeClass(v){ return v>=65?'bad': v>=40?'warn':'ok'; }

--------------------------------------------------------------------- */
const EVENT_LABELS = {
  late_arrival:'Late arrival reported.',
  complaint:'Complaint received.',
  positive_feedback:'Positive feedback received.',
  placement_failure:'Placement ended — household requested replacement.',
  successful_placement:'Placement milestone reached successfully.',
  household_complaint:'Household-side complaint logged.',
  coaching_completed:'Coaching call completed.',
};

function triggerEvent(type, helperId, householdId, opts){
  opts = opts||{};
  const desc = opts.description || EVENT_LABELS[type] || type;
  const date = opts.date || todayIso();
  const placementId = opts.placementId || null;
  const e = {id:uid(), helperId, householdId, placementId, type, description:desc, severity:null, date, source:'live'};
  S.events.push(e);

  const beforeChurn = SCORES[helperId] ? SCORES[helperId].churn : null;
  const beforeTrust = SCORES[helperId] ? SCORES[helperId].trust : null;

  // 1. Memory Agent retains
  retain(helperId, 'experience', desc, {type, date});
  if(householdId) retain(householdId, 'experience', desc, {type, date});

  // 2. Decision Agent recalls context
  recall(helperId, 'evaluating new event');

  // 3. LLM/deterministic severity classification
  const cls = classifySeverity(type);
  e.severity = cls.severity;

  // 4. Score engine recalculates
  recalcAll();
  const afterChurn = SCORES[helperId] ? SCORES[helperId].churn : null;
  const afterTrust = SCORES[helperId] ? SCORES[helperId].trust : null;
  if(afterChurn!=null){
    log('dec','DECISION AGENT', `Recalculated churn risk for ${labelFor(helperId)}. ${beforeChurn} → ${afterChurn}.`);
    retain(helperId, 'opinion', `Churn risk assessed at ${afterChurn}/100 (${churnBadgeClass(afterChurn)==='bad'?'high':churnBadgeClass(afterChurn)==='warn'?'elevated':'low'}).`, {score:afterChurn});
  }

  // 5. Reflection Agent checks pattern threshold; Voice Agent branches coaching vs escalation
  let actionCreated = false;
  const crossedMedium = afterChurn!=null && beforeChurn!=null && afterChurn>=55 && beforeChurn<55;
  const crossedCritical = afterChurn!=null && beforeChurn!=null && afterChurn>=75 && beforeChurn<75;
  if(crossedMedium || crossedCritical){
    log('ref','REFLECTION AGENT', `Compared recent events against historical attendance for ${labelFor(helperId)}. Deteriorating trend confirmed.`);
    const isCritical = afterChurn>=75;
    const rec = {id:uid(), entityType:'helper', entityId:helperId, text:`${labelForShort(helperId)}'s churn risk increased from ${beforeChurn} to ${afterChurn}.`,
      action: isCritical? 'Escalate to coordinator' : 'Start coaching call', callType: isCritical?'escalation':'coaching', createdAt: e.date};
    S.recommendations.unshift(rec);
    log('voice','VOICE AGENT', `Recommended ${isCritical?'an escalation call to the coordinator':'a coaching call'} for ${labelFor(helperId)} based on risk ${isCritical?'reaching critical':'escalation'}.`);
    actionCreated = true;
  }

  // Matching Agent: once risk is critical on an active placement, proactively pre-stage a backup
  if(afterChurn!=null && afterChurn>=75 && householdId){
    const already = S.stagedBackups.find(b=>b.householdId===householdId && b.status==='staged');
    if(!already){
      const hh = S.households.find(x=>x.id===householdId);
      const candidates = findMatches(hh.requirement, householdId).filter(c=>c.helper.id!==helperId);
      if(candidates.length){
        const backup = candidates[0];
        log('match','MATCHING AGENT', `Read Observation Network for ${hh.name}. Pre-staging backup helper in case ${labelFor(helperId)}'s placement needs replacement.`);
        S.stagedBackups.unshift({id:uid(), householdId, atRiskHelperId:helperId, backupHelperId:backup.helper.id, score:backup.score, status:'staged', createdAt:e.date});
        log('match','MATCHING AGENT', `Staged ${backup.helper.name} (match score ${backup.score}/100) as backup for ${hh.name}.`);
      }
    }
  }

  if(householdId){
    const diff = computeDifficulty(householdId);
    SCORES[householdId] = SCORES[householdId]||{};
    SCORES[householdId].difficulty = diff;
  }

  renderCurrentPage();
  return {event:e, beforeChurn, afterChurn, beforeTrust, afterTrust, actionCreated, classification:cls};
}

function startCall(type, helperId, householdId, reason){
  const helper = S.helpers.find(x=>x.id===helperId);
  const household = S.households.find(x=>x.id===householdId);
  recall(helperId, 'preparing call context');
  log('voice','VOICE AGENT', `Initiated ${type} call${helper? ' with '+helper.name:''}. Voice simulation mode — no live Vapi/Bland call is placed in this browser prototype.`);
  const script = (CALL_SCRIPTS[type]||CALL_SCRIPTS.coaching)(helper||{name:'Household contact'}, household);
  const sentiment = type==='escalation' ? 'concerned' : 'cooperative';
  const summary = type==='coaching'
    ? `${helper?firstName(helper.name):'Helper'} acknowledged attendance concerns and committed to proactive updates when running late.`
    : type==='checkin'
    ? `Household raised a scheduling expectation gap; flagged for the household's memory record.`
    : `Helper acknowledged the complaint; case flagged for coordinator review.`;
  const call = {id:uid(), type, helperId, householdId, reason, status:'completed', transcript:script, summary, sentiment, followUp:'In 2 weeks', createdAt:nowStamp()};
  S.calls.unshift(call);

  // after-call extraction + retain
  retain(helperId, 'experience', `${type} call completed. ${summary}`, {callId:call.id});
  if(type==='coaching'){
    retain(helperId, 'opinion', 'Helper demonstrated cooperative response to coaching; commitment logged.', {callId:call.id});
  }
  if(householdId) retain(householdId, 'experience', `${type} call completed regarding this placement.`, {callId:call.id});
  log('mem','MEMORY AGENT', `Call outcome stored for ${helper?helper.name:household?household.name:'record'}.`);

  // recalc after coaching (small relief in risk trend goes into next event's recency window naturally;
  // we also log a coaching_completed event so future scoring reflects the intervention)
  if(type==='coaching' && helperId){
    S.events.push({id:uid(), helperId, householdId, placementId:null, type:'coaching_completed', description:'Coaching call completed; commitments logged.', severity:'LOW', date:todayIso(), source:'live'});
    recalcAll();
    log('dec','DECISION AGENT', `Recalculated churn risk for ${labelFor(helperId)} following coaching. Now ${SCORES[helperId].churn}.`);
  }
  renderCurrentPage();
  return call;
}

function reflectOnHousehold(householdId){
  const hh = S.households.find(h=>h.id===householdId);
  const placements = S.placements.filter(p=>p.householdId===householdId);
  const failed = placements.filter(p=>p.status==='failed' || p.status==='ended_poor_fit');
  recall(householdId, 'comparing placement history');
  log('ref','REFLECTION AGENT', `Retrieved ${placements.length} placement records for ${hh.name} across ${new Set(placements.map(p=>p.helperId)).size} different helpers.`);
  let classification, insight;
  if(failed.length>=3){
    classification='HYPOTHESIS';
    insight = `${failed.length} placements ended in replacement across different helpers, with schedule-related complaints in each. Possible common factor: schedule or expectation mismatch on the household side, rather than helper performance.`;
  } else if(failed.length>=1){
    classification='OBSERVATION';
    insight = `${failed.length} placement(s) at ${hh.name} ended early. Evidence is limited; further placements would clarify whether this is a pattern.`;
  } else {
    classification='FACT';
    insight = `${hh.name} has no failed placements on record. Current placement history shows stability.`;
  }
  const evidence = failed.map(p=>{
    const helper = S.helpers.find(h=>h.id===p.helperId);
    return `${helper?helper.name:p.helperId}: placement ended ${p.end} (${p.status.replace('_',' ')})`;
  });
  const refl = {id:uid(), entityType:'household', entityId:householdId, classification, insight, evidence, confidence: failed.length>=3?0.72:failed.length>=1?0.5:0.9, createdAt:nowStamp()};
  S.reflections.unshift(refl);
  retain(householdId, 'observation', insight, {classification});
  log('ref','REFLECTION AGENT', `Stored ${classification} for ${hh.name}: "${insight}"`);
  renderCurrentPage();
  return refl;
}

function reflectOnRoleFit(helperId){

  const insight = `${h.name} performs consistently better in ${roleLabel(best[0])} (${best[1]}/100) than in ${roleLabel(worst[0])} (${worst[1]}/100), based on historical placement outcomes.`;
  const refl = {id:uid(), entityType:'helper', entityId:helperId, classification:'OBSERVATION', insight, evidence:[`${roleLabel(best[0])} outcomes: strong, repeated positive feedback.`, `${roleLabel(worst[0])} outcomes: below-average feedback, early placement end.`], confidence:0.81, createdAt:nowStamp()};
  S.reflections.unshift(refl);

  renderCurrentPage();
  return refl;
}

--------------------------------------------------------------------- */
function findMatches(role, householdId, opts){
  opts = opts||{};
  const naive = opts.naive; // ignore memory/role-fit, mimic "generic ranking"
  const hh = S.households.find(h=>h.id===householdId);
  recall(householdId, 'retrieving household memory');
  log('match','MATCHING AGENT', `Evaluating candidates for ${hh?hh.name:householdId} — requirement: ${roleLabel(role)}.`);
  const scored = S.helpers.map(h=>{
    recall(h.id);
    const roleFit = h.roleScores[role]||40;
    const trust = SCORES[h.id]?SCORES[h.id].trust:computeTrust(h.id);
    const churn = SCORES[h.id]?SCORES[h.id].churn:computeChurn(h.id);
    let score;
    if(naive){
      score = Math.round(50 + h.exp*2 - (h.location.includes('Hyderabad')?0:5)); // generic, ignores memory
    } else {
      score = Math.round(roleFit*0.5 + trust*0.3 + (100-churn)*0.2);
    }
    return {helper:h, score:clamp(score,0,100), roleFit, trust, churn};
  }).sort((a,b)=>b.score-a.score);

  if(!naive){
    log('match','MATCHING AGENT', `Ranked ${scored.length} candidates using role-specific history, trust signal and churn risk.`);
  } else {
    log('match','MATCHING AGENT', `Ranked ${scored.length} candidates using generic profile fields only (no memory).`);
  }
  return scored;
}

function eventTone(type){
  if(['complaint','negative_feedback','placement_failure'].includes(type)) return type==='placement_failure'?'bad':'warn';
  if(type==='positive_feedback'||type==='successful_placement'||type==='coaching_completed') return 'ok';
  return '';
}
function churnWhy(helperId, churnScore){
  const evs = helperEvents(helperId).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  const reasons = [];
  const lateCount = evs.filter(e=>e.type==='late_arrival').length;
  const complaintCount = evs.filter(e=>e.type==='complaint').length;
  const unresolved = evs.filter(e=>e.type==='complaint').length - evs.filter(e=>e.type==='coaching_completed').length;
  if(lateCount) reasons.push(`${lateCount} late arrival${lateCount>1?'s':''} on record.`);
  if(complaintCount) reasons.push(`${complaintCount} complaint${complaintCount>1?'s':''} on record.`);
  if(unresolved>0) reasons.push(`${unresolved} concern${unresolved>1?'s':''} without a logged follow-up.`);
  if(evs.length && evs[0] && (evs[0].type==='late_arrival'||evs[0].type==='complaint')) reasons.push('Attendance trend is recent, not historical.');
  if(!reasons.length) reasons.push('No adverse signals in the recent window; risk reflects baseline variance.');
  return reasons;
}

function setStage(stage){

}
function resetNarration(){
  const n = document.getElementById('narration');
  if(n) n.innerHTML = '';
}
function step(fn, delay){ return new Promise(res=> setTimeout(()=>{ fn(); res(); }, delay)); }

async function runScenario1(){
  demoRunning = true;
  resetNarration();
  const helperId='anita';
  const placement = S.placements.find(p=>p.helperId===helperId && p.status==='active');
  const householdId = placement.householdId;
  recalcAll();
  const before = SCORES[helperId].churn;

  setStage('Event');
  narrate(`<b>SCENARIO 1 — Save the Placement.</b> Starting state: ${labelFor(helperId)} — Trust ${SCORES[helperId].trust}, Churn risk ${before}.`, 'sys');
  await step(()=>{}, 500);
  narrate(`<span class="agent-tag">EVENT</span> Late arrival reported.`);
  const r1 = triggerEvent('late_arrival', helperId, householdId);
  await step(()=>{}, 700);

  setStage('Memory');
  narrate(`<span class="agent-tag">MEMORY AGENT</span> Retained event to ${labelFor(helperId)}'s experience memory.`);
  await step(()=>{}, 600);
  narrate(`<span class="agent-tag">EVENT</span> Second late arrival, this time with a complaint.`);
  const r2 = triggerEvent('complaint', helperId, householdId);
  await step(()=>{}, 700);

  setStage('Reasoning');
  narrate(`<span class="agent-tag">DECISION AGENT</span> Recalled full history and classified severity: MEDIUM.`);
  await step(()=>{}, 600);

  setStage('Risk');
  narrate(`<span class="agent-tag">DECISION AGENT</span> Churn risk recalculated: ${before} → ${SCORES[helperId].churn}.`);
  await step(()=>{}, 400);
  narrate(`<span class="agent-tag">DECISION AGENT</span> Score written into the Opinion Network — a derived belief, not a raw fact.`);
  await step(()=>{}, 500);
  const why = churnWhy(helperId, SCORES[helperId].churn);
  narrate(`<span class="agent-tag">WHY?</span> ${why.join(' ')}`);
  await step(()=>{}, 700);

  setStage('Action');
  narrate(`<span class="agent-tag">REFLECTION AGENT</span> Deteriorating attendance trend confirmed against history.`);
  await step(()=>{}, 500);
  const isCritical = SCORES[helperId].churn>=75;
  narrate(`<span class="agent-tag">VOICE AGENT</span> Recommended action: ${isCritical? 'escalate to the coordinator.':'initiate coaching call.'}`);
  await step(()=>{}, 800);
  narrate(`<span class="agent-tag">VOICE AGENT</span> Placing ${isCritical?'escalation':'coaching'} call — voice simulation mode.`);
  const call = startCall(isCritical?'escalation':'coaching', helperId, householdId, 'Triggered by churn-risk escalation (Demo Scenario 1).');
  await step(()=>{}, 900);
  if(S.stagedBackups.find(b=>b.householdId===householdId && b.status==='staged')){
    const b = S.stagedBackups.find(x=>x.householdId===householdId && x.status==='staged');
    const backup = S.helpers.find(h=>h.id===b.backupHelperId);
    narrate(`<span class="agent-tag">MATCHING AGENT</span> Read the Observation Network and pre-staged ${backup?backup.name:'a backup helper'} in case this placement needs replacement.`);
    await step(()=>{}, 700);
  }

  setStage('Outcome');
  narrate(`<span class="agent-tag">OUTCOME</span> ${call.summary}`);
  await step(()=>{}, 600);

  setStage('Learning');
  narrate(`<span class="agent-tag">MEMORY AGENT</span> Call outcome retained. Churn risk reassessed: now ${SCORES[helperId].churn}.`);
  narrate(`<b>Future decisions</b> — the next event for ${labelFor(helperId)} will be evaluated against this updated history, including the coaching commitment.`, 'sys');
  narrate(`<a href="#" onclick="nav('helperDetail','${helperId}'); return false;" style="color:#fff; text-decoration:underline;">Open ${labelFor(helperId)}'s profile to see the full timeline →</a>`, 'sys');
  demoRunning = false;
}

  await step(()=>{}, 700);

  setStage('Action');
  narrate(`<span class="agent-tag">RESULT</span> ${smart[0].helper.name} rises to top match, score ${smart[0].score}/100.`);
  await step(()=>{}, 700);

  setStage('Outcome');
  narrate(`<span class="agent-tag">WHY?</span> Recommended because historical memory shows strong elder-care outcomes, low churn risk, and consistent positive feedback.`);
  await step(()=>{}, 600);

  setStage('Learning');
  narrate(`<span class="agent-tag">MEMORY AGENT</span> Role-fit observation stored — future elder-care requirements will use this evidence automatically.`);
  narrate(`<a href="#" onclick="nav('matching'); return false;" style="color:#fff; text-decoration:underline;">Open Matching to see the full recommendation →</a>`, 'sys');
  demoRunning = false;
}

function buildNav(){
  const el = document.getElementById('navlist');
  el.innerHTML = NAV.map(n=>`<button data-id="${n.id}"><span class="dot"></span>${n.label}</button>`).join('');
  el.querySelectorAll('button').forEach((b,i)=>{
    b.onclick = ()=> nav(NAV[i].id, null);
  });
}
function resetDemo(){
  S = clone(INITIAL);
  MEM = {};
  SCORES = {};
  clockTick = 0;
  recalcAll();
  log('mem','MEMORY AGENT', 'Demo reset — all scores, events, calls and reflections restored to initial state.');
  renderCurrentPage();
}
document.getElementById('resetBtn').onclick = resetDemo;

buildNav();
recalcAll();
highlightNav();
renderCurrentPage();
log('mem','MEMORY AGENT', 'System initialized. Institutional memory loaded for 8 helpers and 6 households.');
